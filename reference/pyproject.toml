[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonic-dsp"
version = "0.1.0"
description = "Reference DSP pipeline for Harmonic — multi-phone vibration analysis"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["harmonic_dsp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
